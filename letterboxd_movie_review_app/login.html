<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FilmLog</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="logo" href="index.html">filmlog<span>●</span></a>
  <h1>Welcome back</h1><p class="muted">Sign in to continue your film journey.</p>
  <form id="loginForm">
    <label>Email<input type="email" required placeholder="you@example.com"></label>
    <label>Password<input type="password" required placeholder="••••••••"></label>
    <button class="primary-btn full" type="submit">Sign in</button>
  </form>
  <p id="loginMessage" class="success"></p>
  <p class="center muted">Demo account: any valid email and password</p>
  <a href="index.html" class="back-link">← Back to home</a>
</div>
<script src="script.js"></script>
</body>
</html>
